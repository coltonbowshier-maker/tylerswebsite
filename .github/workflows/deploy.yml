name: Deploy site to GitHub Pages

# Deploys the static site to GitHub Pages on every push to the main branch.
# The whole repository root is published as-is, so this works for any plain
# HTML/CSS/JS site with no build step.

on:
  push:
    branches:
      - claude/website-hosting-updates-w77dkm
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The real site lives in the Website/ subfolder; publish that as the root.
          path: "./Website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
